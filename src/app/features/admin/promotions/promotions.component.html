<div class="min-h-screen bg-gray-50">
  <div class="border-b bg-white shadow-sm">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <h1 class="text-2xl font-bold text-gray-900">Promotion Management</h1>
    </div>
  </div>

  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="mb-4 rounded-lg border bg-white shadow-sm transition"
         [class.border-blue-500]="addPromotionVisible()"
         [class.border-gray-200]="!addPromotionVisible()">
      <button type="button"
              class="flex w-full items-center justify-center gap-2 p-6 text-center text-base font-medium text-gray-700 hover:text-blue-600"
              [attr.aria-expanded]="addPromotionVisible()"
              (click)="toggleAddPromotion()">
        <span class="flex items-center gap-2">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            @if (addPromotionVisible()) {
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            } @else {
              <path stroke-linecap="round" d="M12 5v14M5 12h14" />
            }
          </svg>
          {{ addPromotionVisible() ? 'Cancel adding promotion' : 'Add new Promotion' }}
        </span>
      </button>

      @if (addPromotionVisible()) {
        <div class="border-t border-gray-100 p-4">
          <app-promotion-form (saved)="onPromotionSaved()" (cancelled)="addPromotionVisible.set(false)" />
        </div>
      }
    </div>

    <div class="mb-4 rounded-lg border border-gray-200 bg-white px-6 py-3 shadow-sm">
      <div class="grid grid-cols-[2fr_1fr_1fr_1fr_1fr_1fr_1fr] items-center gap-x-4 text-xs font-semibold uppercase tracking-wider text-gray-500">
        <span>Name</span>
        <span>Type</span>
        <span>Value</span>
        <span>Start</span>
        <span>End</span>
        <span>Count</span>
        <span>Status</span>
      </div>
    </div>

    @if (loading()) {
      <p class="text-sm text-gray-600">Loading promotions...</p>
    } @else if (promotions().length === 0) {
      <div class="rounded-lg border border-dashed border-gray-300 bg-white p-8 text-center shadow-sm">
        <p class="text-sm text-gray-600">No promotions found.</p>
      </div>
    } @else {
      <div class="flex flex-col gap-4">
        @for (promotion of promotions(); track promotion.promotionId) {
          <app-promotion-card [promotion]="promotion" (deleted)="loadPromotions()" (statusChanged)="loadPromotions()" (saved)="loadPromotions()" />
        }
      </div>
    }
  </div>
</div>
