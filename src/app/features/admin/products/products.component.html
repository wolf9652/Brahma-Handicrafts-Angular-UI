<div class="min-h-screen bg-gray-50">
  <div class="border-b bg-white shadow-sm">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <h1 class="text-2xl font-bold text-gray-900">Product Management</h1>
    </div>
  </div>

  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="mb-4 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex flex-wrap gap-2">
        @for (category of categories(); track category.id) {
          <button type="button"
                  class="rounded-full border px-4 py-1.5 text-sm font-medium transition"
                  [class.border-blue-600]="filter() === category.id"
                  [class.bg-blue-600]="filter() === category.id"
                  [class.text-white]="filter() === category.id"
                  [class.border-gray-300]="filter() !== category.id"
                  [class.text-gray-700]="filter() !== category.id"
                  (click)="setFilter(category.id)">
            {{ category.name }}
          </button>
        }
      </div>
    </div>

    <div class="mb-4 rounded-lg border bg-white shadow-sm transition"
         [class.border-blue-500]="addProductVisible()"
         [class.border-gray-200]="!addProductVisible()">
      <button type="button"
              class="flex w-full items-center justify-center gap-2 p-6 text-center text-base font-medium text-gray-700 hover:text-blue-600"
              [attr.aria-expanded]="addProductVisible()"
              (click)="toggleAddProduct()">
        <span class="flex items-center gap-2">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            @if (addProductVisible()) {
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            } @else {
              <path stroke-linecap="round" d="M12 5v14M5 12h14" />
            }
          </svg>
          {{ addProductVisible() ? 'Cancel adding product' : 'Add new product' }}
        </span>
      </button>

      @if (addProductVisible()) {
        <div class="border-t border-gray-100 p-4">
          <app-add-product-form
            [saving]="addProductSaving()"
            [saveError]="addProductError()"
            (saved)="onProductSaved($event)"
            (cancelled)="addProductVisible.set(false)" />
        </div>
      }
    </div>

    <div class="mb-4 rounded-lg border border-gray-200 bg-white px-4 py-3 shadow-sm">
      <div class="flex items-center gap-6">
        <div class="h-16 w-16 shrink-0"></div>
        <div class="grid flex-1 grid-cols-[2fr_1.2fr_1fr_1fr] items-center gap-x-6 text-xs font-semibold uppercase tracking-wider text-gray-500">
          <span>Product</span>
          <span>Category</span>
          <span>Designs</span>
          <span>Total Quantity</span>
        </div>
        <div class="w-5 shrink-0"></div>
      </div>
    </div>

    @if (filteredProducts().length === 0) {
      <p class="text-sm text-gray-600">No products found.</p>
    } @else {
      <div class="flex flex-col gap-4">
        @for (product of filteredProducts(); track product.productId) {
          <app-admin-product-card [product]="product" (saved)="loadProducts()" />
        }
      </div>
    }
  </div>
</div>
