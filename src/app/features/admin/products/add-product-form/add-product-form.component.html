<div class="flex flex-col gap-6">
  <div>
    <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Product</p>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs font-semibold uppercase tracking-wider text-gray-500">Product Name</label>
        <input type="text" [(ngModel)]="product.productName"
               class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold uppercase tracking-wider text-gray-500">Category</label>
        <input type="text" [(ngModel)]="product.categoryName"
               class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none" />
      </div>
    </div>
    @if (productErrors.length > 0) {
      <ul class="mt-3 list-disc pl-5 text-sm text-red-600">
        @for (error of productErrors; track error) {
          <li>{{ error }}</li>
        }
      </ul>
    }
  </div>

  @for (design of designs; track $index; let i = $index) {
    <div class="border-t border-gray-100 pt-6">
      <div class="mb-3 flex items-center justify-between">
        <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Design</p>
        @if (designs.length > 1) {
          <button type="button" class="flex items-center gap-1 text-sm text-gray-500 hover:text-red-600"
                  (click)="removeDesign(i)">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
            </svg>
            Remove design
          </button>
        }
      </div>
      <app-design-form [design]="design" [submitted]="submitted()" />
    </div>
  }

  <div>
    <button type="button" class="rounded-md border border-dashed border-gray-400 px-4 py-2 text-sm font-medium text-gray-700 hover:border-blue-500 hover:text-blue-600"
            (click)="addDesign()">+ Add design</button>
  </div>

  @if (saveError()) {
    <p class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">{{ saveError() }}</p>
  }

  <div class="flex justify-end gap-2">
    <button type="button" class="rounded-md border border-gray-300 px-4 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50"
            [disabled]="saving()"
            (click)="cancelled.emit()">Cancel</button>
    <button type="button" class="rounded-md bg-blue-600 px-4 py-1.5 text-sm font-medium text-white hover:bg-blue-700 disabled:opacity-60"
            [disabled]="saving()"
            (click)="save()">{{ saving() ? 'Saving...' : 'Save product' }}</button>
  </div>
</div>
