<div class="flex flex-wrap gap-3">
  @for (image of images(); track image.key; let ii = $index) {
    <div class="group relative h-24 w-24 overflow-hidden rounded-lg border-2 bg-gray-50"
         [class.border-amber-500]="image.isPrimary"
         [class.border-gray-200]="!image.isPrimary">
      <img [src]="image.src" [alt]="image.altText" class="h-full w-full object-cover" />

      @if (image.isPrimary) {
        <span class="absolute left-1 top-1 rounded bg-amber-500 px-1.5 py-0.5 text-[10px] font-semibold text-white">Primary</span>
      }

      @if (editable()) {
        <div class="absolute inset-0 hidden flex-col items-center justify-center gap-2 bg-black/40 text-white group-hover:flex">
          <button type="button" class="hover:text-red-300" title="Remove image" (click)="removeImage(ii)">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
            </svg>
          </button>
          @if (!image.isPrimary) {
            <button type="button"
                    class="rounded bg-white/90 px-2 py-0.5 text-[11px] font-semibold text-gray-900 hover:bg-white"
                    (click)="setPrimary(ii)">Set primary</button>
          }
        </div>
      }
    </div>
  }

  @if (editable()) {
    <button type="button"
            class="flex h-24 w-24 items-center justify-center rounded-lg border-2 border-dashed border-gray-300 text-gray-400 hover:border-blue-500 hover:text-blue-600"
            title="Add images"
            (click)="toggleDropzone()">
      <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" d="M12 5v14M5 12h14" />
      </svg>
    </button>
  }
</div>

@if (editable() && dropzoneOpen()) {
  <div class="mt-3 rounded-lg border-2 border-dashed border-gray-300 p-4 text-center text-sm text-gray-600"
       (dragover)="onDragOver($event)"
       (drop)="onDrop($event)">
    <p class="mb-2">Drag and drop images here, or</p>
    <label class="cursor-pointer font-medium text-blue-600 hover:underline">
      Select files
      <input type="file" accept="image/*" multiple class="hidden" (change)="onFilesSelected($event)" />
    </label>
  </div>
}
