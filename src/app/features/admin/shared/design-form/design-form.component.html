@let d = design();

<div class="grid grid-cols-1 gap-4 sm:grid-cols-[2fr_3fr_1fr]">
  <div>
    <label class="mb-1 block text-xs font-semibold uppercase tracking-wider text-gray-500">Design Name</label>
    <input type="text" [(ngModel)]="d.designName"
           class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none" />
  </div>
  <div>
    <label class="mb-1 block text-xs font-semibold uppercase tracking-wider text-gray-500">Description</label>
    <textarea rows="2" [(ngModel)]="d.designDescription"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none"></textarea>
  </div>
  <div>
    <label class="mb-1 block text-xs font-semibold uppercase tracking-wider text-gray-500">Estimated Price (₹)</label>
    <input type="number" min="0" [(ngModel)]="d.estimatedPrice"
           class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none" />
  </div>
</div>

<div class="mt-4">
  <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Images</p>
  <app-image-uploader [(images)]="d.images" />
</div>

<div class="mt-4">
  <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Sizes</p>
  <div class="flex flex-col gap-3">
    @for (size of d.sizes; track $index; let i = $index) {
      <app-size-form [size]="size" (removed)="removeSize(i)" />
    }
  </div>
  <button type="button" class="mt-3 text-sm font-medium text-blue-600 hover:underline" (click)="addSize()">+ Add size</button>
</div>

@if (errors.length > 0) {
  <ul class="mt-4 list-disc pl-5 text-sm text-red-600">
    @for (error of errors; track error) {
      <li>{{ error }}</li>
    }
  </ul>
}
