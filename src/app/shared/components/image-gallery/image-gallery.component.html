<div class="relative overflow-hidden rounded-lg">
  <img [src]="current()" [alt]="alt()" class="h-[100] w-full rounded-lg object-cover" />

  @if (images().length > 1) {
    <span class="absolute right-3 top-3 rounded-full bg-black/40 px-3 py-1 text-xs font-medium tracking-wide text-white backdrop-blur-md">
      {{ selectedIndex() + 1 }}/{{ images().length }}
    </span>

    <button type="button"
            aria-label="Previous image"
            class="absolute left-3 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/25 text-white ring-1 ring-white/40 backdrop-blur-md transition hover:bg-white/40"
            (click)="previous()">
      <i class="pi pi-chevron-left"></i>
    </button>

    <button type="button"
            aria-label="Next image"
            class="absolute right-3 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/25 text-white ring-1 ring-white/40 backdrop-blur-md transition hover:bg-white/40"
            (click)="next()">
      <i class="pi pi-chevron-right"></i>
    </button>
  }
</div>
