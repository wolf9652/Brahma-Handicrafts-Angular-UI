<div class="fixed right-0 top-0 bottom-0 z-40 w-full max-w-md bg-background/95 backdrop-blur-md shadow-sm backdrop-saturate-150 transition-transform duration-300 ease-in-out" >
  <div class="flex h-full flex-col">
    <div class="flex items-center justify-between border-b border-[#fde68a] px-6 py-4">
      <h2 class="text-lg font-semibold text-[#78350f]">Your Cart</h2>
      <button type="button" class="text-sm text-[#78350f]" (click)="onCartClick()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="flex-1 min-h-0 overflow-y-auto px-6 py-4">
      <div *ngIf="cartService.items().length === 0" class="rounded-lg bg-slate-50 p-4 text-sm text-slate-600">
        Your cart is empty.
      </div>

      <div *ngFor="let item of cartService.items()" class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex items-start gap-4">
          <img [src]="item.product.image" [alt]="item.product.name" class="h-20 w-20 rounded-3xl object-cover" />
          <div class="flex-1 min-w-0">
            <div class="flex items-start gap-3">
              <p class="flex-1 truncate text-base font-semibold text-slate-900">{{ item.product.name }}</p>
              <button type="button" class="text-slate-500 hover:text-slate-900" (click)="cartService.removeFromCart(item.product.id)">
                <i class="pi pi-trash"></i>
              </button>
            </div>
            <p class="mt-1 text-sm font-semibold text-amber-700">₹{{ item.product.price * item.quantity }}</p>
            <div class="mt-3 inline-flex items-center rounded-full border border-slate-300 bg-slate-50 p-1 text-sm shadow-sm">
              <button type="button" class="h-9 w-9 rounded-full bg-white text-slate-700 transition hover:bg-slate-100" (click)="cartService.decreaseQuantity(item.product.id)">−</button>
              <span class="mx-3 min-w-[2rem] text-center font-medium">{{ item.quantity }}</span>
              <button type="button" class="h-9 w-9 rounded-full bg-white text-slate-700 transition hover:bg-slate-100" (click)="cartService.increaseQuantity(item.product.id)">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="border-t border-[#fde68a] px-6 py-4">
      <div class="mb-3 flex items-center justify-between text-sm text-black">
        <span>Total</span>
        <span class="font-semibold text-slate-900">₹{{ cartService.getTotal() }}</span>
      </div>
      <a routerLink="/checkout" class="block rounded-full border border-[#fde68a] bg-amber-700 px-4 py-2 text-center text-sm font-semibold text-white hover:shadow-lg hover:-translate-y-1" (click)="onCartClick()">Proceed to Checkout</a>
    </div>
  </div>
</div>
