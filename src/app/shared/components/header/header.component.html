<header class="fixed top-0 left-0 right-0 z-30 border-b border-amber-200 bg-background/95 backdrop-blur-md shadow-sm backdrop-saturate-150">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <button type="button"
        (click)="onLogoClick()"
        class="p-3 rounded-full flex items-center justify-center  text-amber-700 hover:bg-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2">
        <i class="pi pi-sidebar"></i>
    </button>
    <a routerLink="/" class="flex items-center gap-3 text-amber-900">
      <img src="/assets/photos/BH-logo.png" alt="Brahma Handicrafts logo" class="h-10 w-10 rounded-full object-cover" />
      <span class="text-xl font-semibold tracking-wide aboreto-regular">Brahma Handicrafts</span>
    </a>

    <div class="flex items-center gap-3">
      <button type="button" (click)="openLogin()" class=" relative cursor-pointer rounded-full bg-transparent border border-amber-300 px-3 py-2 text-sm text-amber-800 hover:bg-amber-100">
        <i class="pi pi-user"></i>
      </button>
      <a routerLink="/wishlist" class="relative rounded-full border border-amber-300 px-3 py-2 text-sm font-medium text-amber-800 hover:bg-amber-100">
        <i class="pi pi-heart"></i>
        <span *ngIf="wishlistCount > 0" class="absolute -right-2 -top-2 inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-amber-700 px-1.5 text-xs font-semibold text-white ">
          {{ wishlistCount }}
        </span>
      </a>
      <div (click)="onCartClick()" class="relative rounded-full bg-amber-700 px-3 py-2 text-sm font-medium text-white hover:bg-amber-800">
        <i class="pi pi-shopping-cart"></i>
        <span *ngIf="cartCount > 0" class="absolute -right-2 -top-2 inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-white px-1.5 text-xs font-semibold text-amber-700">
          {{ cartCount }}
        </span>
      </div>
      <a routerLink="/admin" class="rounded-full border border-amber-300 px-3 py-2 text-sm font-medium text-amber-800">
        Admin
      </a>
    </div>
  </div>

  <p-dialog 
  [(visible)]="showLoginDialog" 
  [modal]="true" 
  [closable]="true" 
  [dismissableMask]="true"
  [style]="{width: '400px'}"
  appendTo="body"
  [contentStyle]="{'padding':'0'}"
  (onHide)="closeLogin()">
    <app-auth></app-auth>
  </p-dialog>
</header>
