@if (label()) {
  <h2 class="mb-4 text-xl font-bold text-gray-900">{{ label() }}</h2>
}

<div class="space-y-3 rounded-xl bg-[#e8dac3] p-4">
  @if (addressService.addresses().length === 0 && !showForm()) {
    <p class="px-1 text-sm text-gray-700">No saved addresses yet.</p>
  }

  @for (address of addressService.addresses(); track address.id) {
    <button type="button"
            class="w-full rounded-lg border-2 bg-[#f3e6cf] p-4 text-left transition"
            [class.border-gray-900]="selectedAddressId() === address.id"
            [class.border-transparent]="selectedAddressId() !== address.id"
            (click)="select(address.id)">
      <p class="font-semibold text-gray-900">
        {{ address.customerName }} &nbsp; {{ address.customerPhoneNumber }}
        @if (address.isDefault) {
          <span class="ml-2 rounded-full bg-amber-300 px-2 py-0.5 text-xs font-semibold text-amber-900">Default</span>
        }
      </p>
      <p class="mt-1 text-sm text-gray-700">{{ address.addressLine1 }}, {{ address.city }}, {{ address.state }}, {{ address.postalCode }}</p>
    </button>
  }

  @if (!showForm()) {
    <button type="button"
            class="flex w-full items-center justify-center gap-2 rounded-lg border-2 border-dashed border-gray-500 bg-[#f3e6cf] p-4 text-sm font-medium text-gray-700 hover:border-gray-900"
            (click)="toggleForm()">
      <i class="pi pi-plus"></i>
      Add new Address
    </button>
  } @else {
    <div class="rounded-lg border border-gray-300 bg-white p-4">
      <div class="space-y-3">
        <input type="text" placeholder="Customer Name" [(ngModel)]="customerName" name="customerName" class="w-full rounded-lg border border-gray-300 px-4 py-2" />
        <input type="text" placeholder="Customer Phone Number" [(ngModel)]="customerPhoneNumber" name="customerPhoneNumber" class="w-full rounded-lg border border-gray-300 px-4 py-2" />
        <input type="text" placeholder="Address Line 1" [(ngModel)]="addressLine1" name="addressLine1" class="w-full rounded-lg border border-gray-300 px-4 py-2" />
        <div class="grid gap-3 md:grid-cols-2">
          <input type="text" placeholder="City" [(ngModel)]="city" name="city" class="w-full rounded-lg border border-gray-300 px-4 py-2" />
          <select [(ngModel)]="state" name="state" class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2">
            <option value="" disabled>State</option>
            @for (indianState of indianStates; track indianState.code) {
              <option [value]="indianState.name">{{ indianState.name }}</option>
            }
          </select>
        </div>
        <div class="grid gap-3 md:grid-cols-2">
          <input type="text" placeholder="Postal Code" [(ngModel)]="postalCode" name="postalCode" class="w-full rounded-lg border border-gray-300 px-4 py-2" />
          <input type="text" placeholder="Country" [(ngModel)]="country" name="country" class="w-full rounded-lg border border-gray-300 px-4 py-2" />
        </div>
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input type="checkbox" [(ngModel)]="isDefault" name="isDefault" />
          Set as default address
        </label>
      </div>
      <div class="mt-4 flex gap-3">
        <button type="button" class="rounded-full bg-[#2e2e2e] px-6 py-2 text-sm font-semibold text-white disabled:opacity-60" [disabled]="saving()" (click)="saveAddress()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
        <button type="button" class="rounded-full border border-gray-400 px-6 py-2 text-sm font-medium text-gray-600" [disabled]="saving()" (click)="cancelForm()">
          Cancel
        </button>
      </div>
    </div>
  }
</div>
